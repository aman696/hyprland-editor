[package]
name = "hyprland-editor-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = ["native54"]
native54 = []
native55 = []

[[bin]]
name = "hyprland-editor-source55"
path = "src/bin/source55.rs"
required-features = ["native55"]

[[test]]
name = "source55"
path = "tests/source55.rs"
required-features = ["native55"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
libc = "0.2"
tree-sitter = "=0.27.1"
tree-sitter-lua = "=0.5.0"
sha2 = "0.10"
quick-xml = "=0.38.4"

[build-dependencies]
cc = "=1.8.0"
pkg-config = "0.3"
