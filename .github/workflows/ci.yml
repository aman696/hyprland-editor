name: Quality checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Native dependencies
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libadwaita-1-dev pkg-config xvfb
      - name: Pinned toolchain
        run: rustup toolchain install 1.90.0 --profile minimal --component rustfmt --component clippy
      - run: cargo fmt --all --check
      - run: python3 scripts/check_catalogue.py
      - run: python3 scripts/generate_catalogue.py --check
      - run: cargo test --locked --workspace
      - name: Native graphical smoke test
        run: xvfb-run -a env GDK_BACKEND=x11 GSK_RENDERER=cairo GSETTINGS_BACKEND=memory HYPRLAND_EDITOR_TEST_EXACT_RESIZE=1 cargo test --locked -p hyprland-editor -- --ignored --test-threads=1
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo build --locked --release
